<!doctype html>

    <link rel="canonical" href="https://smarttablenyc.com/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/styles.css?v=guest-account-1">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://smarttablenyc.com/#organization",
            "name": "SmartTable",
            "url": "https://smarttablenyc.com/"
          },
          {
            "@type": "WebSite",
            "@id": "https://smarttablenyc.com/#website",
            "url": "https://smarttablenyc.com/",
            "name": "SmartTable",
            "publisher": {
              "@id": "https://smarttablenyc.com/#organization"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://smarttablenyc.com/#app",
            "name": "SmartTable",
            "url": "https://smarttablenyc.com/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Any",

        ]

  <body>
    <a class="skip-link" href="#app">Skip to main content</a>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="SmartTable home">
          <span class="brand-mark">ST</span>
          <span>
            <strong>SmartTable</strong>
            <small>Discounted restaurant reservations</small>
          </span>
        </a>

        <nav class="top-actions" aria-label="Primary navigation">
          <button class="ghost-button" id="guestNav" type="button">Offers</button>
          <button class="ghost-button" id="restaurantsNav" type="button">Restaurants</button>
          <button class="ghost-button" id="contactNav" type="button">Contact</button>
          <button class="ghost-button" id="aiConciergeNav" type="button" hidden>AI Concierge</button>

          <button class="ghost-button" id="restaurantNav" type="button" hidden>Partner</button>

          <button class="primary-button" id="sessionButton" type="button">Login</button>

      <main id="app" class="app-shell" aria-live="polite" tabindex="-1"></main>

    <script src="/app.js?v=guest-account-1" type="module"></script>
